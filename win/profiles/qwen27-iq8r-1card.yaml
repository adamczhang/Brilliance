# Brilliance profile: Qwen3.8-27B IQ8R-V4 on one Radeon AI PRO R9700.
# 16K tokens of context, four requests at once, DFlash2 speculation from the container, an int8 KV
# cache: the 26.67 GiB of weights leave about 3 GiB of the card for the cache. Soak-clean
# since 2026-11-17 (SUPPORT.md).
#
#   .\serve.ps1 qwen27-iq8r-1card -Bus 6
#   bin\radiance.exe --config profiles\qwen27-iq8r-1card.yaml
#
# The model file: StillDeadcode/qwen3.8-27b-iqr-v4 on Hugging Face, qwen3.8-27b-iq8r-v4.rad,
# 27.58 GiB (29,618,270,208 bytes), SHA-256
# 474cb9fc49714a56455a26c0ab3049bd029dc1abae31e4eb9cc66026f0edf04d. Point `model:` at where it is.
#
# The card: name ONE card with serve.ps1's -Bus (its PCI bus) or -Device (its HIP index). With exactly
# one card visible, HIP virtual memory is on and the KV cache is elastic; without -Bus every discrete
# card is visible, the first is used, and the cache is sized whole. Soak-tested on one card, named
# with -Bus.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 qwen27-iq8r-1card -Bus 6
# -Listen 0.0.0.0 -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
models:
  qwen3.8-27b:
    model: D:/models/hf/StillDeadcode/qwen3.8-27b-iqr-v4/qwen3.8-27b-iq8r-v4.rad
    tp: 1
    max-num-seqs: 4
    max-model-len: 16384
    kv-cache-dtype: i8
