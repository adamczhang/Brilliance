# Brilliance profile: Qwen3.8-Flash-Next IQR-V4 on four Radeon AI PRO R9700s, tensor parallel (TP4),
# every expert on the cards (placement: all_vram, about 17 GiB of weights a card).
# 256K tokens of context (262,144), eight requests at once, a bf16 KV cache, MTP speculation with an
# adaptive depth up to 5, and prefill steps of up to 6,144 tokens. When the cards' PCIe links differ,
# the large exchanges give their reduce work to the fastest links (BRILLIANCE_AR4_SHARD_WEIGHTS,
# auto by default; REFERENCE.md), with the same output bits as an even split. With no expert read
# from host memory, the two-card lost write (SUPPORT.md, known issue 1) has not been seen. Supported: soaked at 32K on its earlier settings
# (2,048-token steps and an int8 KV cache), before the four-card re-send and stop (SUPPORT.md,
# known issue 1). With them, these tuned settings pass the injection, stop and serving checks; a
# soak on them has not run yet.
#
# What the tuned settings do:
#   max-model-len: 262144         the model's full context. On the test machine the KV cache holds
#                                 about 917,000 tokens across all requests (12.5 GiB a card), about three
#                                 and a half full-length conversations.
#   kv-cache-dtype: bf16          the cache unquantized; i8 halves it.
#   max-num-batched-tokens: 6144  with prefill-span: 3, a prompt alone in its step is prefilled up
#   prefill-span: 3               to 6,144 tokens a step, three 2,048-token checkpoint intervals.
#                                 Every other step is planned at 2,048 tokens.
#   checkpoint-slots: 8           eight linear-state snapshots, in pinned host memory (0.9 GiB).
#   vision-tower-placement: ram   the picture and audio encoders (857 MiB a card) pinned in host
#                                 memory, their VRAM given to the KV cache.
#   ngram-warm: false             no warm read at load: since 0.3.1 the gather prefetches its rows
#                                 (BRILLIANCE_NGRAM_PREFETCH), and cold decode, 8-stream and prefill
#                                 measured within ~1% with and without the warm on four cards (prefill ~1% lower without it)
#                                 (2026-11-22), while the warm added ~9 s to every load.
# No host prefix cache (prefix-cache-mib not set): a 14.25 GiB one beside the pinned encoders exceeds
# what Windows lets this process pin with the integrated GPU visible too (16.93 GiB). The minute log
# line's flag/ack re-store counts run about 6x higher than at 2,048-token steps; that is harmless
# (SUPPORT.md, known issue 1).
#
# KNOWN ISSUE (SUPPORT.md, known issue 8): Flash-Next's output can change when requests share a
# step. Identical requests sent together can get different next-token distributions, and sampling
# over them is looser than the temperature asked. One request at a time is repeatable. Clients send
# side requests beside a chat (titles, tags), so it can show up in normal use. It is rounding, not
# wrong data.
#
#   .\serve.ps1 flashnext-4card
#   .\serve.ps1 flashnext-4card -Bus 6,3,9,32
#   bin\radiance.exe --config profiles\flashnext-4card.yaml
#
# The model file: StillDeadcode/qwen3.8-next-flash-iqr-v4 on Hugging Face (revision 679c9432),
# qwen3.8-next-flash-iqr-v4.rad, 113.32 GiB, SHA-256
# 25aff8c950f4b823bc8b77c8184ed48827cb47058ffce08ae2c83b12e021fea0. Point `model:` at where it is.
# Its 47.68 GiB n-gram table fits neither the cards nor what the process may pin, and is read from the
# file on its own. The soak's load took 16.4 s; the timeout below allows 10 minutes.
#
# The cards: without -Bus every discrete card HIP shows is used, the integrated GPU left out; with
# exactly four, that is all of them. Name the four with -Bus (PCI buses) or -Device (HIP indices) on a
# machine with more. Windows HIP determines device order. The startup report lists the ranks.
# Cards talk through pinned host memory (no peer-to-peer on Windows), and HIP virtual memory is
# off with more than one card visible, so the KV cache is sized whole at load.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 flashnext-4card -Listen 0.0.0.0
# -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
memory:
  gpu-headroom-mib: 160
  # A card that also drives a display or runs other GPU applications can keep more free on its
  # own: card-headroom-mib: {1: 1536}, by its card number in the startup report (0, 1, ...).
  # The other cards keep 160 MiB and put the room they have beyond the busy card into resident
  # experts; the KV cache is the same on every card.
scheduler:
  load-timeout: 600s
models:
  qwen3.8-next-flash:
    model: D:/models/hf/StillDeadcode/qwen3.8-next-flash-iqr-v4/qwen3.8-next-flash-iqr-v4.rad
    tp: 4
    placement: all_vram
    max-num-seqs: 8
    max-model-len: 262144
    kv-cache-dtype: bf16
    checkpoint-slots: 8
    vision-tower-placement: ram
    # The drafting stack, as on two cards: up to 5 MTP drafts, coupled drafting, traversal verify,
    # an adaptive depth that stops at 0.85 and backs off under load. On four R9700s it measured about
    # 13% faster single-stream decode, with prefill unchanged. Its greedy text is that of a fixed
    # depth of 3; against decoding without drafts it can differ where two tokens are almost tied,
    # as it can when other requests share a step (SUPPORT.md, known issues 5 and 8).
    num-speculative-tokens: 5
    draft-coupling: on
    draft-verify: traversal
    draft-depth: adaptive
    draft-depth-stop: 0.85
    draft-depth-load: on
    max-num-batched-tokens: 6144
    prefill-span: 3
    ngram-warm: false
    # weight-prefetch off: not measured at TP4; same host-staged collective path as TP2, where an A/B (prefetch-ab, 2026-11-22) measured update p50 18.2 -> 13.1 ms, combined decode +37%, greedy output identical. The G6 gate measures it.
    weight-prefetch: off
