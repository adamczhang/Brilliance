# Brilliance profile: Inkling 2 Mini with its DSpark drafter (NVFP4 experts as the release ships
# them, an int8 trunk and head, the vision tower) on one Radeon AI PRO R9700. Supported (SUPPORT.md):
# its API checks pass on one card; no soak or concurrency qualification yet, so long-run stability
# is unproven.
# 128K tokens of context, four requests at once, an int8 KV cache. Loads in 10 to 23 s and holds
# 29.41 GiB of the card: 16.97 GiB of weights (14.55 GiB of experts), the vision tower, and an
# 11.68 GiB cache (the trunk's and the drafter's) for every sequence at full length; the 883 MiB
# token embedding is pinned in host memory. DSpark speculation at the drafter's own depth, seven
# tokens a block, each sequence verifying its drafts up to the first one unlikely to be kept
# (draft-window adaptive), as the container's card serves it. Text, tool calls and pictures.
# Reasoning effort "none" by default: the model still writes a short reasoning block before its
# answer, which a client's token limit counts. A request raises it with
# "chat_template_kwargs": {"reasoning_effort": "high"}.
#
#   .\serve.ps1 inkling2-mini-dspark-1card -Bus 6
#   bin\radiance.exe --config profiles\inkling2-mini-dspark-1card.yaml
#
# The model file: gostar77/inkling2-mini-i8-dspark-radiance on Hugging Face,
# inkling2-mini-i8-vl-dspark.rad, 17.83 GiB (19,141,197,824 bytes), SHA-256
# d31e9f78a71ae7b10929a2a294d342167339b611bb0ac17dcb19b8da9173b4d2. Point `model:` at where it is.
# Apache 2.0, as Thinking Machines' Inkling 2 Mini; its acceptable use policy applies.
#
# Plain decoding: set num-speculative-tokens to 0. Greedy text with and without the drafter can
# differ where two tokens are nearly tied (verifying a block rounds differently from decoding one
# token at a time); each is the model's own greedy text.
#
# The card: name ONE card with serve.ps1's -Bus (its PCI bus) or -Device (its HIP index). With exactly
# one card visible, HIP virtual memory is on and the KV cache is elastic; without -Bus every discrete
# card is visible, the first is used, and the cache is sized whole.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 inkling2-mini-dspark-1card -Bus 6
# -Listen 0.0.0.0 -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
models:
  inkling2-mini-dspark:
    model: D:/models/hf/gostar77/inkling2-mini-i8-dspark-radiance/inkling2-mini-i8-vl-dspark.rad
    tp: 1
    max-num-seqs: 4
    max-model-len: 131072
    kv-cache-dtype: i8
    num-speculative-tokens: 7
    draft-window: adaptive
    chat-template-kwargs: {"reasoning_effort": "none"}
