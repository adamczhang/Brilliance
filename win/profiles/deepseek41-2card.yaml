# Brilliance profile: DeepSeek-V4.1-Flash-1017 (bakon3's uncensored RAD2 file: IQ1_S and IQ2_XXS
# routed experts) on two Radeon AI PRO R9700s, tensor parallel (TP2). Two cards cannot hold the
# routed experts: each rank keeps what fits on its card, then in its share of a pinned host pool, and
# the rest in ordinary RAM, repacked once at load; the file on disk is the fallback for what RAM
# does not hold. A short-context baseline: 4,096 tokens, one request, a bf16 KV cache, plain decoding.
# Runs, not yet qualified: it loads, serves plain completions and chat with thinking on and off,
# and stops cleanly on Ctrl-Break. No soak, stop or concurrency checks have run on it.
#
# What the settings do:
#   placement: expert_tiered      each rank's 192 routed experts a layer go to its card first, then
#                                 to its share of the host pool, then (weights-disk-tier) to the file
#                                 tier.
#   host-pool-mib: 40960          the pinned host pool for weights, 20 GiB a rank, read by the cards
#                                 in place. One process seeing two cards may pin about 46.8 GiB in
#                                 all; the pool, its read windows and the mailboxes must fit under it.
#   weights-disk-tier: true       a routed expert that fits neither the card nor the pool is read for
#   expert-ram-mib: 24576         the layer that routes to it -- from ordinary RAM when the RAM store
#                                 holds it (up to 12 GiB a rank, repacked from the file's planes once
#                                 at load, not pinned), from the file otherwise. On the test machine
#                                 the store held every such expert (about 9 GiB a rank) and nothing
#                                 was read from the disk while serving.
#                                 The load refuses before allocating anything when the pinned pools
#                                 would pass what the process may pin, or the peak would leave less
#                                 than 24 GiB of memory available.
#   max-model-len: 4096           one sequence of 4,096 tokens.
#   max-num-batched-tokens: 512   prefill steps of up to 512 tokens.
#   tp-wire: exact                the collectives carry exact bf16 through pinned host memory
#   p2p: off                      (no peer-to-peer on Windows).
#   num-speculative-tokens: 0     the file's built-in drafter (DSpark) is not loaded; no prompt lookup.
#   ngram-placement: disk         the 103 GiB Engram table stays in the container's file mapping;
#                                 each step reads the rows it needs from it on the host.
#   deterministic: true           placement is fixed at load.
#   kernels: libr4d,libref        the card kernels, and the reference library for the host-side
#                                 rows (libavx has no rows for this model's new ops yet).
#
# Memory on the test machine: about 30.5 GiB of VRAM a card held, and about 61 GiB less host memory
# available while it served (the 40 GiB pinned pool, the 18 GiB RAM store and the mailboxes; the
# Engram table's pages are file cache). The load read 118 GiB from the file, filled the RAM store in
# about 2 s a rank, and took about 33 s.
#
# The checkpoint states no sampling of its own: a request that sends no sampler fields is sampled at
# temperature 1 over the whole vocabulary. Send temperature (and top_p) with each request.
#
#   .\serve.ps1 deepseek41-2card -Bus 3,9
#   bin\radiance.exe --config profiles\deepseek41-2card.yaml
#
# For placement and host admission, copy this profile to deepseek41-plan.yaml and add
# `plan-only: true` under deepseek-v4.1-flash, at the same indentation as `tp: 2`.
#   .\serve.ps1 .\deepseek41-plan.yaml -Bus 3,9
# Use your two cards' PCI buses. The plan initializes both cards and stops before allocating
# the placement pools or loading weights. Read the admission verdict in the log: an admitted
# plan exits 0, a refused one exits 1 with the reason. See PREVIEW.md.
#
# The model file: bakon3/DeepSeek-V4.1-Flash-1017-uncensored-rad on Hugging Face,
# deepseek-v4.1-flash-1017-uncensored.rad, 269,650,269,832 bytes (251.13 GiB), reassembled from the
# repository's six parts. Point `model:` at where it is. The separate Q8_0 DSpark sidecar beside it
# is not used.
#
# The cards: name the two with -Bus (the pair on the widest links). Windows HIP determines device
# order. The engine's startup report shows each serving rank and its PCI address.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 deepseek41-2card -Listen 0.0.0.0
# -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
  kernels: libr4d,libref
scheduler:
  load-timeout: 1200s
models:
  deepseek-v4.1-flash:
    model: D:/models/hf/bakon3/DeepSeek-V4.1-Flash-1017-uncensored-rad/deepseek-v4.1-flash-1017-uncensored.rad
    tp: 2
    tp-wire: exact
    p2p: off
    placement: expert_tiered
    host-pool-mib: 40960
    weights-disk-tier: true
    expert-ram-mib: 24576
    max-model-len: 4096
    max-num-seqs: 1
    max-num-batched-tokens: 512
    kv-cache-dtype: bf16
    num-speculative-tokens: 0
    ngram-placement: disk
    deterministic: true
    # weight-prefetch off: Windows TP2 A/B on flashnext-2card-fast (prefetch-ab, 2026-11-22): update p50 18.2 -> 13.1 ms, combined decode +37%, greedy output identical; same host-staged collective path.
    weight-prefetch: off
