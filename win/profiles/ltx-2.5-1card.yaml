# Brilliance profile: LTX-2.5 distilled IQ8R (video with sound) on one Radeon AI PRO R9700.
# Runs, not yet qualified. OpenAI's video jobs only: POST /v1/videos queues one (text to video, or
# image to video with `input_reference` as the first frame). Poll GET /v1/videos/ID for
# `status: completed` before downloading the MP4 from GET /v1/videos/ID/content (H.264 and AAC,
# marked AI-generated in its metadata). DELETE /v1/videos/ID removes the job and cancels it if
# it is still running.
# Chat and embeddings answer 501. LTX-2.5 runs on one card only; tp above 1 is refused.
# If a one-card Sandbox fleet refuses to load LTX after other models have unloaded, stop the
# fleet and start this standalone profile.
#
#   .\serve.ps1 ltx-2.5-1card -Bus 6
#   bin\radiance.exe --config profiles\ltx-2.5-1card.yaml
#
# Memory: the DiT (21.10 GiB) and the activation arena (9.21 GiB) fill the card, so the Gemma text
# encoder (14.00 GiB) and the token embedding (1.88 GiB) are pinned in host memory and read over the
# link once a prompt: about 30.3 GiB of the card and 15.9 GiB of pinned host memory. The
# `vision-tower-placement: ram` line below says so; without it the engine moves the encoder to host
# memory by itself when the card cannot hold it, and says so in its log.
# On the test machine it loaded in about 9 s, and a 2-second 768x512 video took about 7 s.
#
# The model file: StillDeadcode/radiance-ltx-2.5-distilled-iq8r on Hugging Face,
# ltx-2.5-distilled-iq8r.rad, 36.86 GiB (39,578,374,144 bytes), SHA-256
# 308e7bcd2b88c352118eeebd5803827158819e960dc371b9c2a8a86ae45f1db1. Point `model:` at where it is.
# The repository is gated: accept the licence on its page with your own account and download with
# your own token (HF_TOKEN for libexec\brilliance\hfget.ps1).
#
# LICENCE: LTX-2.5 is under the LTX-2.x Community License Agreement of Lightricks Ltd. Entities at or
# above US$10M a year in revenue need a paid licence for any use other than a non-commercial one, and
# its use restrictions apply to the model and to the videos it makes: whoever serves it to others
# must require them to follow them. The server shows the licence at
# /terms/licenses/ltx-2.x-community-license, and the terms template (TERMS-OF-USE.md) passes the
# restrictions on; read it before serving the model to anyone.
#
# Video encoding: AMD's encoder (h264_amf), else Windows' (h264_mf); SUPPORT.md has the details.
#
# The card: name ONE card with serve.ps1's -Bus (its PCI bus) or -Device (its HIP index). With exactly
# one card visible, HIP virtual memory is on; without -Bus every discrete card is visible and the
# first is used.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 ltx-2.5-1card -Bus 6
# -Listen 0.0.0.0 -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
models:
  ltx-2.5:
    model: D:/models/hf/StillDeadcode/radiance-ltx-2.5-distilled-iq8r/ltx-2.5-distilled-iq8r.rad
    tp: 1
    vision-tower-placement: ram
