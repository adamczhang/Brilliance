# Brilliance profile: Qwen3.8-Flash-Next IQR-V4 on four Radeon AI PRO R9700s, tensor parallel (TP4),
# every expert on the cards (placement: all_vram, about 17 GiB of weights a card).
# 32K tokens of context, eight requests at once, an int8 KV cache, MTP speculation 3 deep, 2,048
# batched tokens. With no expert read from host memory, the two-card lost write (SUPPORT.md, known
# issue 1) has not been seen. Soak-clean (2026-11-17), before the four-card re-send and stop were
# added; with them it passes the injection and serving checks (SUPPORT.md).
#
# KNOWN ISSUE (SUPPORT.md, known issue 8): Flash-Next's output changes when requests share a
# step. Identical requests sent together get different next-token distributions, and sampling over
# them is looser than the temperature asked. One request at a time behaves normally. Clients send
# side requests beside a chat (titles, tags), so it can show up in normal use. Under investigation.
#
#   .\serve.ps1 flashnext-4card
#   .\serve.ps1 flashnext-4card -Bus 6,3,9,32
#   bin\radiance.exe --config profiles\flashnext-4card.yaml
#
# The model file: StillDeadcode/qwen3.8-next-flash-iqr-v4 on Hugging Face (revision 679c9432),
# qwen3.8-next-flash-iqr-v4.rad, 113.32 GiB, SHA-256
# 25aff8c950f4b823bc8b77c8184ed48827cb47058ffce08ae2c83b12e021fea0. Point `model:` at where it is.
# Its 47.68 GiB n-gram table fits neither the cards nor what the process may pin, and is read from the
# file on its own. The soak's load took 16.4 s; the timeout below allows 10 minutes.
#
# The cards: without -Bus every discrete card HIP shows is used, the integrated GPU left out; with
# exactly four, that is all of them. Name the four with -Bus (PCI buses) or -Device (HIP indices) on a
# machine with more; rank 0 is the first named. Cards talk through pinned host memory (no peer-to-peer on Windows), and HIP virtual memory is
# off with more than one card visible, so the KV cache is sized whole at load.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 flashnext-4card -Listen 0.0.0.0
# -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
memory:
  gpu-headroom-mib: 160
scheduler:
  load-timeout: 600s
models:
  qwen3.8-next-flash:
    model: D:/models/hf/StillDeadcode/qwen3.8-next-flash-iqr-v4/qwen3.8-next-flash-iqr-v4.rad
    tp: 4
    placement: all_vram
    max-num-seqs: 8
    max-model-len: 32768
    kv-cache-dtype: i8
    num-speculative-tokens: 3
    max-num-batched-tokens: 2048
