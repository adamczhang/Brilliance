# Brilliance profile: Qwen-Image 2.1 IQ8R (pictures) on one Radeon AI PRO R9700.
# OpenAI's images API only: /v1/images/generations and /v1/images/edits; chat and embeddings answer
# 501. 8,192 tokens a request: pictures up to about 1.9 megapixels (1024x1024 is 4,096 tokens), as
# upstream's one-card entry (deploy/compose/tp1.radiance.yaml). The engine sizes the step and batch
# for an image model itself, and turns drafting and the prefix cache off. Runs, not yet qualified:
# started, made a 1024x1024 picture and stopped cleanly on one card; edits come out with colour noise
# (SUPPORT.md, known issue 13).
#
#   .\serve.ps1 qwen-image-1card -Bus 6
#   bin\radiance.exe --config profiles\qwen-image-1card.yaml
#
# The model file: StillDeadcode/radiance-qwen-image-2.1-iq8r on Hugging Face, qwen-image-2.1-iq8r.rad,
# 16.13 GiB (17,324,531,712 bytes), SHA-256
# 99656ced8317b6dcecddeee2c14c3400c80105cb894ac1e05aec94ca215a7dfb. Point `model:` at where it is.
#
# LICENCE: Qwen-Image 2.1 is under the Qwen RESEARCH LICENSE AGREEMENT: non-commercial use only
# (research or evaluation). The server shows it at /terms/licenses/qwen-research, and the terms
# template (TERMS-OF-USE.md) passes the restriction on; read it before serving the model to anyone.
#
# The card: name ONE card with serve.ps1's -Bus (its PCI bus) or -Device (its HIP index). With exactly
# one card visible, HIP virtual memory is on and the KV cache is elastic; without -Bus every discrete
# card is visible, the first is used, and the cache is sized whole.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 qwen-image-1card -Bus 6
# -Listen 0.0.0.0 -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
models:
  qwen-image:
    model: D:/models/hf/StillDeadcode/radiance-qwen-image-2.1-iq8r/qwen-image-2.1-iq8r.rad
    tp: 1
    max-model-len: 8192
