# Brilliance profile: Gemma 4 31B a4 (4-bit weights, 8-bit activations) on one Radeon AI PRO R9700.
# 32K tokens of context, two requests at once, the default (bf16) KV cache: the 19.95 GiB of weights
# leave about 11 GiB of the card for the cache. Upstream's one-card settings from the container's
# card (tp 1, two sequences; its peer-to-peer line dropped: Windows has none). Thinking is off
# by this profile (the container's card sets no default, and the model reasons by default without
# it); a request turns it on with "chat_template_kwargs": {"enable_thinking": true}. Qualified:
# chat, Responses and Messages, tools, pictures and video on one card (SUPPORT.md).
#
#   .\serve.ps1 gemma4-31b-1card -Bus 6
#   bin\radiance.exe --config profiles\gemma4-31b-1card.yaml
#
# The model file: keptn/gemma4-31b-a4 on Hugging Face, gemma4-31b-a4.rad (the README's
# gemma4-31b-w4a8, renamed), 19.95 GiB (21,420,716,032 bytes), SHA-256
# 71bdc6c30297760a9b2db43efaa6a665de7ec9162b2a244b308439b7620c6fbe. Point `model:` at where it is.
# Apache 2.0, as Google's Gemma 4.
#
# The card: name ONE card with serve.ps1's -Bus (its PCI bus) or -Device (its HIP index). With exactly
# one card visible, HIP virtual memory is on and the KV cache is elastic; without -Bus every discrete
# card is visible, the first is used, and the cache is sized whole.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 gemma4-31b-1card -Bus 6
# -Listen 0.0.0.0 -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
models:
  gemma4-31b:
    model: D:/models/hf/keptn/gemma4-31b-a4/gemma4-31b-a4.rad
    tp: 1
    max-num-seqs: 2
    max-model-len: 32768
    chat-template-kwargs: {"enable_thinking": false}
