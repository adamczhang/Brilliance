# Brilliance profile: Gemma 4 12B i8g (8-bit weights, with its picture and audio encoders) on one
# Radeon AI PRO R9700.
# 32K tokens of context, four requests at once, the default (bf16) KV cache: the 13.79 GiB container
# leaves about 17 GiB of the card for the cache. Thinking off by default, as the container's card
# sets it; a request turns it on with "chat_template_kwargs": {"enable_thinking": true}. Runs, not
# yet qualified: started, answered chat and stopped cleanly on one card (SUPPORT.md).
#
#   .\serve.ps1 gemma4-12b-1card -Bus 6
#   bin\radiance.exe --config profiles\gemma4-12b-1card.yaml
#
# The model file: keptn/gemma4-12b-i8g on Hugging Face, gemma4-12b-i8g.rad, 13.79 GiB
# (14,804,865,024 bytes), SHA-256 258fee3b0498faa8ce20e8c045eade497d45c2c5c959ccf9e53b846b531c4ceb.
# Point `model:` at where it is. Apache 2.0, as Google's Gemma 4.
#
# The card: name ONE card with serve.ps1's -Bus (its PCI bus) or -Device (its HIP index). With exactly
# one card visible, HIP virtual memory is on and the KV cache is elastic; without -Bus every discrete
# card is visible, the first is used, and the cache is sized whole.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 gemma4-12b-1card -Bus 6
# -Listen 0.0.0.0 -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
models:
  gemma4-12b:
    model: D:/models/hf/keptn/gemma4-12b-i8g/gemma4-12b-i8g.rad
    tp: 1
    max-num-seqs: 4
    max-model-len: 32768
    chat-template-kwargs: {"enable_thinking": false}
