# Brilliance profile: the dashboard's Sandbox. GENERATED by win/tools/sandbox_profile.py from the
# other profiles in this folder; do not edit it by hand (`python -I win/tools/sandbox_profile.py write`).
#
# One radiance process serving every shipped profile as a model of its own, named after the profile,
# with startup warm-up off. A request or Sandbox Start can load an entry. Models can stay resident
# together when they fit. Start holds the selected model until Stop. For quick fleet checks, open
# the dashboard (http://127.0.0.1:8000/). To serve one model, start its own profile.
#
#   .\serve.ps1 sandbox                    every discrete card, so every entry can load on four
#   .\serve.ps1 sandbox -Bus 3,9           two cards: the one- and two-card entries
#
# Every entry needs as many cards as its tp. radiance refuses to start a fleet with an entry whose tp
# exceeds its cards ("tp N needs N cards"), so the launcher (serve.ps1) starts it without those
# entries and names each one it dropped. The scheduler chooses each entry's cards among the visible
# ones (docs/MULTIMODEL.md section 8.4).
# Speeds and memory are not the same as starting the profile alone: with more than one card visible,
# HIP virtual memory is off, so a one-card entry's KV cache is sized whole at load, and the pin limit
# is the one for the visible cards (SUPPORT.md, known issue 3); a load the limit refuses fails with
# the reason on the page. Process-wide settings take the smallest headroom and the longest load
# timeout any profile sets.
#
# Loopback only and no key: Start and Stop answer a browser on this machine only.
server:
  host: 127.0.0.1
  port: 8000
memory:
  gpu-headroom-mib: 160
scheduler:
  load-timeout: 1200s
  warm-up: false
models:
  gemma4-12b-1card:              # profiles/gemma4-12b-1card.yaml (its model: gemma4-12b), 1 card
    model: D:/models/hf/keptn/gemma4-12b-i8g/gemma4-12b-i8g.rad
    tp: 1
    max-num-seqs: 4
    max-model-len: 32768
    chat-template-kwargs: {"enable_thinking": false}
  gemma4-31b-1card:              # profiles/gemma4-31b-1card.yaml (its model: gemma4-31b), 1 card
    model: D:/models/hf/keptn/gemma4-31b-a4/gemma4-31b-a4.rad
    tp: 1
    max-num-seqs: 2
    max-model-len: 32768
    chat-template-kwargs: {"enable_thinking": false}
  ltx-2.5-1card:              # profiles/ltx-2.5-1card.yaml (its model: ltx-2.5), 1 card
    model: D:/models/hf/StillDeadcode/radiance-ltx-2.5-distilled-iq8r/ltx-2.5-distilled-iq8r.rad
    tp: 1
    vision-tower-placement: ram
  minicpm5-2b-1card:              # profiles/minicpm5-2b-1card.yaml (its model: minicpm5-2b), 1 card
    model: D:/models/hf/StillDeadcode/minicpm5-2b-iq8r/minicpm5-2b-iq8r.rad
    tp: 1
    max-num-seqs: 4
    max-model-len: 32768
    chat-template-kwargs: {"enable_thinking": false}
    # num-speculative-tokens: 0
  qwen-image-1card:              # profiles/qwen-image-1card.yaml (its model: qwen-image), 1 card
    model: D:/models/hf/StillDeadcode/radiance-qwen-image-2.1-iq8r/qwen-image-2.1-iq8r.rad
    tp: 1
    max-model-len: 8192
  qwen27-8k-plain:              # profiles/qwen27-8k-plain.yaml (its model: qwen3.8-27b), 1 card
    model: D:/models/hf/StillDeadcode/qwen3.8-27b-iqr-v4/qwen3.8-27b-iq4r-l-v4.rad
    tp: 1
    max-num-seqs: 1
    max-model-len: 8192
    num-speculative-tokens: 0
  qwen27-iq8r-1card:              # profiles/qwen27-iq8r-1card.yaml (its model: qwen3.8-27b), 1 card
    model: D:/models/hf/StillDeadcode/qwen3.8-27b-iqr-v4/qwen3.8-27b-iq8r-v4.rad
    tp: 1
    max-num-seqs: 4
    max-model-len: 16384
    kv-cache-dtype: i8
  qwen27-preview:              # profiles/qwen27-preview.yaml (its model: qwen3.8-27b), 1 card
    model: D:/models/hf/StillDeadcode/qwen3.8-27b-iqr-v4/qwen3.8-27b-iq4r-l-v4.rad
    tp: 1
    max-num-seqs: 4
    max-model-len: 32768
  deepseek41-2card:              # profiles/deepseek41-2card.yaml (its model: deepseek-v4.1-flash), 2 cards
    model: D:/models/hf/bakon3/DeepSeek-V4.1-Flash-1017-uncensored-rad/deepseek-v4.1-flash-1017-uncensored.rad
    tp: 2
    tp-wire: exact
    p2p: off
    placement: expert_tiered
    host-pool-mib: 40960
    weights-disk-tier: true
    expert-ram-mib: 24576
    max-model-len: 4096
    max-num-seqs: 1
    max-num-batched-tokens: 512
    kv-cache-dtype: bf16
    num-speculative-tokens: 0
    ngram-placement: disk
    deterministic: true
    # weight-prefetch off: Windows TP2 A/B on flashnext-2card-fast (prefetch-ab, 2026-11-22): update p50 18.2 -> 13.1 ms, combined decode +37%, greedy output identical; same host-staged collective path.
    weight-prefetch: off
  flashnext-2card:              # profiles/flashnext-2card.yaml (its model: qwen3.8-next-flash), 2 cards
    model: D:/models/hf/StillDeadcode/qwen3.8-next-flash-iqr-v4/qwen3.8-next-flash-iqr-v4.rad
    tp: 2
    placement: expert_tiered
    host-pool-mib: 16384
    max-num-seqs: 8
    max-model-len: 262144
    kv-cache-dtype: i8
    prefix-cache-mib: 4096
    checkpoint-slots: 8
    vision-tower-placement: ram
    # The drafting stack: up to 5 MTP drafts, coupled drafting, traversal verify, an
    # adaptive depth that stops at 0.85 and backs off under load: about 13% faster single-stream
    # decode and 8% more eight-request throughput on two R9700s. Its greedy text is that of a fixed
    # depth of 3; against decoding without drafts it can differ where two tokens are almost tied,
    # as it can when other requests share a step (SUPPORT.md, known issues 5 and 8).
    num-speculative-tokens: 5
    draft-coupling: on
    draft-verify: traversal
    draft-depth: adaptive
    draft-depth-stop: 0.85
    draft-depth-load: on
    max-num-batched-tokens: 6144
    prefill-span: 3
    ngram-warm: true
    # weight-prefetch off: Windows TP2 A/B on flashnext-2card-fast (prefetch-ab, 2026-11-22): update p50 18.2 -> 13.1 ms, combined decode +37%, greedy output identical; same host-staged collective path.
    weight-prefetch: off
  flashnext-2card-fast:              # profiles/flashnext-2card-fast.yaml (its model: qwen3.8-next-flash), 2 cards
    model: D:/models/hf/StillDeadcode/qwen3.8-next-flash-iqr-v4/qwen3.8-next-flash-iqr-v4.rad
    tp: 2
    tp-wire: wht6
    placement: expert_tiered
    host-pool-mib: 16384
    max-num-seqs: 8
    max-model-len: 262144
    kv-cache-dtype: i8
    prefix-cache-mib: 4096
    checkpoint-slots: 8
    vision-tower-placement: ram
    num-speculative-tokens: 5
    draft-coupling: on
    draft-verify: traversal
    draft-depth: adaptive
    draft-depth-stop: 0.85
    draft-depth-load: on
    max-num-batched-tokens: 6144
    prefill-span: 3
    ngram-warm: true
    # weight-prefetch off: measured on this profile, Windows TP2 A/B (prefetch-ab, 2026-11-22): update p50 18.2 -> 13.1 ms, combined decode +37%, greedy output identical.
    weight-prefetch: off
