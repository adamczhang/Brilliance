# Brilliance profile: Qwen3.8-27B IQ8R-V4 on two Radeon AI PRO R9700s, tensor parallel (TP2).
# 32K tokens of context, four requests at once, DFlash2 speculation from the container, the default
# (bf16) KV cache. 13.98 GiB of weights a card: the model fits both cards whole, so no expert is read
# from host memory. Soak-clean (SUPPORT.md).
#
#   .\serve.ps1 qwen27-iq8r-2card -Bus 3,9
#   bin\radiance.exe --config profiles\qwen27-iq8r-2card.yaml
#
# The model file: StillDeadcode/qwen3.8-27b-iqr-v4 on Hugging Face, qwen3.8-27b-iq8r-v4.rad,
# 27.58 GiB (29,618,270,208 bytes), SHA-256
# 474cb9fc49714a56455a26c0ab3049bd029dc1abae31e4eb9cc66026f0edf04d. Point `model:` at where it is.
#
# The cards: name TWO with serve.ps1's -Bus (PCI buses) or -Device (HIP indices). Windows HIP
# determines device order. The startup report lists the ranks. Without -Bus the first two discrete
# cards HIP shows are used and the rest stay visible,
# which lowers the pin limit (SUPPORT.md, known issue 3); name the two. Cards talk
# through pinned host memory (no peer-to-peer on Windows), and HIP virtual memory is off with more
# than one card visible, so the KV cache is sized whole at load.
#
# Loopback only and no key. To serve the local network: .\serve.ps1 qwen27-iq8r-2card -Bus 3,9
# -Listen 0.0.0.0 -ApiKey env:NAME (or -ApiKey off), and allow the port for the private network only.
server:
  host: 127.0.0.1
  port: 8000
models:
  qwen3.8-27b:
    model: D:/models/hf/StillDeadcode/qwen3.8-27b-iqr-v4/qwen3.8-27b-iq8r-v4.rad
    tp: 2
    max-num-seqs: 4
    max-model-len: 32768
    # weight-prefetch off: Windows TP2 A/B on flashnext-2card-fast (prefetch-ab, 2026-11-22): update p50 18.2 -> 13.1 ms, combined decode +37%, greedy output identical; same host-staged collective path.
    weight-prefetch: off
